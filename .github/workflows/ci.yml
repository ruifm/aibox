---
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          kvm: true

      - name: Check VM test support
        run: |
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::NixOS tests require access to /dev/kvm"
            exit 1
          fi

      - name: Allow Bubblewrap user namespaces in CI
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true

      - name: Nix flake checks
        run: nix flake check -L

      - name: Development checks
        run: nix develop -c just check

      - name: Integration tests
        run: nix develop -c just test-integration

      - name: Check release version and notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: nix develop -c just check-release "$RELEASE_TAG"

      - name: Verify generated changes are committed
        run: |
          if ! git diff --quiet; then
            echo "::error::checks produced uncommitted changes"
            git --no-pager diff
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
